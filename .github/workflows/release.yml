name: Release packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-deck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Actual source revision
        run: git rev-parse HEAD
      - uses: actions/checkout@v4
        with:
          repository: just-addwater/KlikBack
          ref: 6e178b9470206f71871417dec852fbfa24cd01b9
          path: build/klikback
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libsdl2-dev python3-dev python3-venv python3-tk xvfb xauth desktop-file-utils
      - name: Build PNG and WAV media libraries
        run: bash packaging/build-media.sh
      - name: Build and test the native game
        run: |
          export PKG_CONFIG_PATH="$PWD/build/media/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_SKIP_RPATH=ON
          cmake --build build/release --parallel 2
          LD_LIBRARY_PATH="$PWD/build/media/lib" ctest --test-dir build/release --output-on-failure
      - name: Freeze first-start importer and GUI with system Python and Tk
        run: |
          /usr/bin/python3 -m venv build/venv
          build/venv/bin/pip install pyinstaller==6.16.0
          build/venv/bin/python packaging/freeze.py
          bash packaging/bundle-linux.sh
      - name: Verify isolated packaged launcher, imports and renderer
        run: /usr/bin/python3 packaging/smoke.py
      - name: Check local installation and desktop entry
        run: |
          echo 0.6.0 > build/package/funny-furries/VERSION
          XDG_DATA_HOME="$PWD/build/install space/data" HOME="$PWD/build/install space" bash build/package/funny-furries/install.sh
          desktop-file-validate 'build/install space/data/applications/funny-furries.desktop'
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy FF_NO_REPORT=1 'build/install space/data/funny-furries-app/current/play.sh' --practice --fullscreen --smoke 1000
      - run: python3 packaging/audit.py build/package/funny-furries
      - name: Package Linux and Deck plus complete corresponding source
        run: |
          mkdir -p build/artifacts
          tar -C build/package -czf build/artifacts/funny-furries-linux-deck-x86_64.tar.gz funny-furries
          python3 packaging/source.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deck-release
          path: build/artifacts/*
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actual source revision
        run: git rev-parse HEAD
      - uses: actions/checkout@v4
        with:
          repository: just-addwater/KlikBack
          ref: 6e178b9470206f71871417dec852fbfa24cd01b9
          path: build/klikback
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-SDL2 zip
      - name: Build media and game; test two controller seats
        shell: msys2 {0}
        run: |
          bash packaging/build-media.sh
          export PKG_CONFIG_PATH="$PWD/build/media/lib/pkgconfig:$PKG_CONFIG_PATH"
          export PATH="$PWD/build/media/bin:$PATH"
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_SKIP_RPATH=ON
          cmake --build build/release --parallel 2
          ctest --test-dir build/release --output-on-failure
      - name: Freeze importer with Python and Tk
        run: |
          python -m pip install pyinstaller==6.16.0
          python packaging/freeze.py
      - name: Bundle native DLL dependencies
        shell: msys2 {0}
        run: bash packaging/bundle-windows.sh
      - name: Verify isolated packaged launcher, Unicode import and renderer
        run: python packaging/smoke.py
      - run: python packaging/audit.py build/package/funny-furries
      - name: Package Windows
        shell: msys2 {0}
        run: |
          echo 0.6.0 > build/package/funny-furries/VERSION
          mkdir -p build/artifacts
          cd build/package
          zip -qr ../artifacts/funny-furries-windows-x86_64.zip funny-furries
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/artifacts/*
